<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 製図の検図票。上に3面図、下に寸法照合表と確認状況 */
:root{
  --bg:#f3f5f7; --paper:#ffffff; --fg:#1d2630; --muted:#5b6876; --line:#d5dce3;
  --accent:#1f6f8b; --ok:#2e7d4f; --hold:#a86a12; --okbg:#e5f3ea; --holdbg:#fbf0dd;
  --sans:"IBM Plex Sans JP",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171c; --paper:#1a2128; --fg:#e3e9ef; --muted:#9aa7b4; --line:#2e3943;
  --accent:#6bb7d3; --ok:#7ccf9b; --hold:#e2ae5a; --okbg:#183025; --holdbg:#33280f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171c; --paper:#1a2128; --fg:#e3e9ef; --muted:#9aa7b4; --line:#2e3943;
  --accent:#6bb7d3; --ok:#7ccf9b; --hold:#e2ae5a; --okbg:#183025; --holdbg:#33280f; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.65}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:32px 48px;display:grid;gap:28px}
header{display:grid;gap:6px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--muted)}
h1{font-size:clamp(22px,4vw,30px);margin:0;text-wrap:balance}
h2{font-size:17px;margin:0 0 10px}
.lead{color:var(--muted);margin:0;max-width:65ch}
.views{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.side{display:grid;gap:12px}
figure{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden}
figure img{display:block;width:100%;height:auto}
figcaption{font-family:var(--mono);font-size:12px;color:var(--muted);padding:6px 10px;border-top:1px solid var(--line)}
section{min-width:0}
.tbl{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.04em}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;font-weight:600}
.ok{background:var(--okbg);color:var(--ok)} .hold{background:var(--holdbg);color:var(--hold)}
ul.check{list-style:none;padding:0;margin:0;display:grid;gap:6px}
ul.check li{display:flex;gap:10px;align-items:baseline}
code{font-family:var(--mono);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media (max-width:700px){.views,.grid2{grid-template-columns:1fr}}
</style>
<div class="wrap">
<header>
  <div class="eyebrow">{{eyebrow}}</div>
  <h1>{{title}}</h1>
  <p class="lead">{{summary}}</p>
</header>

<div class="views">
  <figure><img src="{{iso_src}}" alt="等角図"><figcaption>等角図</figcaption></figure>
  <div class="side">
    <figure><img src="{{front_src}}" alt="正面図"><figcaption>正面図</figcaption></figure>
    <figure><img src="{{top_src}}" alt="上面図"><figcaption>上面図</figcaption></figure>
  </div>
</div>

<section>
  <h2>寸法の照合（単位 mm）</h2>
  <div class="tbl"><table>
    <tr><th>部品</th><th>期待する外形</th><th>計測した外形</th><th>体積 mm³</th><th>判定</th></tr>
{{dimension_rows}}
  </table></div>
</section>

<div class="grid2">
<section>
  <h2>パラメータ</h2>
  <div class="tbl"><table>
    <tr><th>名前</th><th>値</th><th>意味</th></tr>
{{param_rows}}
  </table></div>
</section>
<section>
  <h2>確認状況</h2>
  <ul class="check">
{{check_items}}
  </ul>
</section>
</div>

<section>
  <h2>関係するファイル</h2>
  <div class="tbl"><table>
    <tr><th>パス</th><th>内容</th></tr>
{{file_rows}}
  </table></div>
</section>
</div>
